models:
  - Qwen/Qwen2.5-1.5B-Instruct

# Caminho relativo ao diretório em que o comando é executado.
output_dir: ./outputs_hatebr_lora
seed: 42

dataset:
  name: franciellevargas/HateBR
  test_size: 0.2
  validation_size: 0.1

model:
  use_4bit: true

generation:
  max_length: 512
  max_new_tokens: 4

training:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  num_epochs: 3
  learning_rate: 0.0002
  batch_size: 4
  gradient_accumulation_steps: 4

causal:
  parquet_path: ./corpora/GeneratedCorpus/corpora_v3.parquet
  text_column: text
  scenarios: all
  # 0 avalia todo o corpus Parquet.
  max_rows: 0
  stride: 512
  max_length: null
