models:
  # Strings continuam sendo interpretadas como modelos Hugging Face (backend: hf).
  - name: Manaca
    backend: hf
    path: ../models/models/menezesbruno/manaca-1b-base
    tokenizer: ../models/models/menezesbruno/manaca-1b-base

  - name: Tucano
    backend: hf
    path: ../models/models/TucanoBR/Tucano-2b4
    tokenizer: ../models/models/TucanoBR/Tucano-2b4

  - name: Sabia
    backend: hf
    path: ../models/models/maritaca-ai/sabia-7b
    tokenizer: ../models/models/maritaca-ai/sabia-7b

  - name: Gemma4
    backend: hf
    path: ../models/models/google/gemma-4-12B
    tokenizer: ../models/models/google/gemma-4-12B

  - name: Qwen3.5
    backend: hf
    path: ../models/models/Qwen/Qwen3.5-9B-Base
    tokenizer: ../models/models/Qwen/Qwen3.5-9B-Base

  - name: Llama3.1
    backend: hf
    path: ../models/models/meta-llama/Meta-Llama-3.1-8B
    tokenizer: ../models/models/meta-llama/Meta-Llama-3.1-8B
  
  - name: Candeia-xLSTM-350M
    backend: xlstm
    path: /media/data/matheusvieira/candeia-xlstm-350M/model.pt
    tokenizer: /media/data/matheusvieira/candeia-xlstm-350M/tokenizer.model
  
  - name: Candeia-Transformer-350M
    backend: candeia_transformer
    path: /media/data/matheusvieira/candeia-transformer-350M/model.pt
    tokenizer: /media/data/matheusvieira/candeia-transformer-350M/tokenizer.model


# Caminho relativo ao diretório em que o comando é executado.
output_dir: ./outputs_hatebr_lora
seed: 42

dataset:
  name: franciellevargas/HateBR
  test_size: 0.2
  validation_size: 0.1

model:
  use_4bit: false

generation:
  max_length: 512
  max_new_tokens: 4

training:
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  num_epochs: 10
  learning_rate: 0.0002
  batch_size: 4
  gradient_accumulation_steps: 4

causal:
  parquet_path: ./corpora/GeneratedCorpus/corpora_v3.parquet
  results_dir: ./outputs_hatebr_lora/causal_results
  text_column: text
  scenarios: all
  # 0 avalia todo o corpus Parquet.
  max_rows: 0
  stride: 512
  max_length: null
